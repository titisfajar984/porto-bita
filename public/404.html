<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Halaman tidak ditemukan — Adinda Wira Zahra Tsabitah</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --page: #ecedf0;
        --card: #ffffff;
        --foreground: #0b0c10;
        --muted: #6b7280;
        --primary: #2a4bd7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--foreground);
        font-family: Poppins, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      main {
        width: min(560px, 100%);
        background: var(--card);
        border-radius: 28px;
        padding: 40px;
        box-shadow: 0 20px 60px -30px rgba(25, 45, 120, 0.25);
        text-align: center;
      }
      p.eyebrow {
        margin: 0 0 12px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--primary);
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 44px);
        font-weight: 300;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      p.body {
        margin: 16px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-size: 13.5px;
        font-weight: 500;
        text-decoration: none;
      }
      a.button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Halaman tidak ditemukan</h1>
      <p class="body">
        Alamat yang Anda buka tidak tersedia. / The page you were looking for is not available.
      </p>
      <a class="button" href="/">Kembali ke beranda</a>
    </main>
  </body>
</html>
